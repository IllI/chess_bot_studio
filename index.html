                    🔄 Reset
                  </button>
                </div>
              </div>

              {/* Progress */}
              <div className="space-y-4">
                {/* Current Phase Indicator */}
                {isTraining && (
                  <div className="flex items-center gap-3 p-3 bg-cyan-500/10 rounded-xl border border-cyan-500/20">
                    <div className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse" />
                    <span className="text-sm text-cyan-300">
                      {neuralStatus?.current_phase === 'self_play' && (
                        <>Generating self-play games: {neuralStatus?.self_play?.games_completed || 0}/{neuralStatus?.self_play?.games_target || selfPlayGames}</>
                      )}
                      {neuralStatus?.current_phase === 'training' && (
                        <>Training epoch {neuralStatus?.epochs_completed || 0}/{neuralStatus?.target_epochs || epochs}</>
                      )}
                      {neuralStatus?.current_phase === 'starting' && 'Initializing...'}
                      {neuralStatus?.current_phase === 'complete' && '✓ Training complete!'}
                    </span>
                  </div>
                )}
                
                <div className="flex justify-between text-sm">
                  <span className="text-slate-400">Overall Progress</span>
                  <span className="font-mono text-cyan-400">
                    {neuralStatus?.current_phase === 'self_play' 
                      ? `Self-play: ${neuralStatus?.self_play?.games_completed || 0}/${neuralStatus?.self_play?.games_target || selfPlayGames} games`
                      : `${neuralStatus?.epochs_completed || 0}/${neuralStatus?.target_epochs || epochs} epochs`
                    }
                  </span>
                </div>
                <div className="h-4 bg-slate-950 rounded-full overflow-hidden border border-white/5">
                  <div
                    style={{ width: `${Math.min(100, progress)}%` }}
                    className="h-full bg-gradient-to-r from-cyan-600 to-blue-500 transition-all duration-500"
                  />
                </div>
                <div className="flex justify-between text-xs text-slate-500">
                  <span>Loss: <span className="text-cyan-400 font-bold">{(neuralStatus?.current_loss || 0).toFixed(6)}</span></span>
                  <span>Positions: <span className="text-cyan-400 font-bold">{stats.positions_trained || 0}</span></span>
                  <span>{progress.toFixed(0)}% complete</span>
                </div>
              </div>
            </div>

            {/* Logs */}
            <div className="glass rounded-[32px] p-8 h-[250px] flex flex-col bg-black/20">
              <h3 className="font-bold text-sm uppercase tracking-widest mb-6 flex items-center gap-3 text-slate-400">
                <span className="text-cyan-400">›</span> Neural Training Log
              </h3>
              <div className="flex-1 overflow-y-auto space-y-1 mono text-[11px] text-slate-400 custom-scrollbar">
                {logs.length === 0 && <div className="italic text-slate-600">Configure parameters and start training...</div>}
                {logs.map((log, i) => (
                  <div key={i} className="flex gap-2">
                    <span className="text-cyan-500 shrink-0 opacity-50">›</span>
                    <span>{log}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Sidebar */}
          <div className="lg:col-span-5 space-y-6">
            {/* Live Chessboard during self-play */}
            {isTraining && neuralStatus?.current_phase === 'self_play' && (
              neuralStatus?.current_game ? (
                <div className="glass rounded-[32px] p-6 shadow-xl border-cyan-500/20 bg-cyan-500/5">
                  <div className="flex items-center justify-between mb-4">
                    <div className="flex items-center gap-3 text-white">
                      <span className="text-cyan-400">♟</span>
                      <h3 className="font-bold text-lg">Live Self-Play</h3>
                    </div>
                    <span className="text-xs font-mono text-cyan-400">
                      Game {neuralStatus.current_game.game_number}/{neuralStatus.current_game.total_games}
                    </span>
                  </div>
                  <LiveChessboard
                    fen={neuralStatus.current_game.fen}
                    whiteId={neuralStatus.current_game.white_id}
                    blackId={neuralStatus.current_game.black_id}
                    moveCount={neuralStatus.current_game.move_count}
                    lastMove={neuralStatus.current_game.last_move}
                  />
                </div>
              ) : (
                <div className="glass rounded-[32px] p-6 shadow-xl border-cyan-500/20 bg-cyan-500/5">
                  <div className="flex items-center gap-3 mb-4 text-white">
                    <span className="text-cyan-400">♟</span>
                    <h3 className="font-bold text-lg">Live Self-Play</h3>
                  </div>
                  <div className="aspect-square bg-slate-950 rounded-xl flex items-center justify-center border border-white/10">
                    <div className="text-center space-y-3">
                      <div className="text-4xl animate-pulse">🧠</div>
                      <p className="text-sm text-slate-400">Starting self-play...</p>
                    </div>
                  </div>
                </div>
              )
            )}
            
            {/* Training visualization during epoch training */}
            {isTraining && neuralStatus?.current_phase === 'training' && (
              <div className="glass rounded-[32px] p-6 shadow-xl border-purple-500/20 bg-purple-500/5">
                <div className="flex items-center gap-3 mb-4 text-white">
                  <span className="text-purple-400">📈</span>
                  <h3 className="font-bold text-lg">Training Progress</h3>
                </div>
                <div className="space-y-4">
                  <div className="text-center py-8">
                    <div className="text-6xl mb-4">🧠</div>
                    <p className="text-lg font-bold text-purple-400">
                      Epoch {neuralStatus?.epochs_completed || 0}/{neuralStatus?.target_epochs || epochs}
                    </p>
                    <p className="text-sm text-slate-400 mt-2">
                      Training on {dataStats.total_positions || 0} positions
                    </p>
                  </div>
                  <div className="p-4 bg-slate-950/50 rounded-xl">
                    <div className="flex justify-between text-sm mb-2">
                      <span className="text-slate-400">Current Loss</span>
                      <span className="font-mono text-purple-400">{(neuralStatus?.current_loss || 0).toFixed(6)}</span>
                    </div>
                    <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                      <div 
                        className="h-full bg-purple-500 transition-all"
                        style={{ width: `${Math.max(5, 100 - (neuralStatus?.current_loss || 0) * 100)}%` }}
                      />
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Network Stats */}
            <div className="glass rounded-[32px] p-8 shadow-xl border-cyan-500/20 bg-cyan-500/5">
              <div className="flex items-center gap-3 mb-6 text-white">
                <span className="text-cyan-400">📊</span>
                <h3 className="font-bold text-xl">Network Statistics</h3>
              </div>
              <div className="space-y-3 text-sm">
                <div className="flex justify-between p-3 bg-slate-950/50 rounded-xl">
                  <span className="text-slate-400">Games Trained</span>
                  <span className="font-mono text-cyan-400">{neuralStatus?.network_stats?.games_trained || stats.games_trained || 0}</span>
                </div>
                <div className="flex justify-between p-3 bg-slate-950/50 rounded-xl">
                  <span className="text-slate-400">Positions Trained</span>
                  <span className="font-mono text-cyan-400">{neuralStatus?.network_stats?.positions_trained || stats.positions_trained || 0}</span>
                </div>
                <div className="flex justify-between p-3 bg-slate-950/50 rounded-xl">
                  <span className="text-slate-400">Average Loss</span>
                  <span className="font-mono text-cyan-400">{(neuralStatus?.network_stats?.avg_loss || stats.avg_loss || 0).toFixed(6)}</span>
                </div>
                <div className="flex justify-between p-3 bg-slate-950/50 rounded-xl">
                  <span className="text-slate-400">Network Version</span>
                  <span className="font-mono text-cyan-400">v{neuralStatus?.network_stats?.version || stats.version || 0}</span>
                </div>
              </div>
            </div>

            {/* Save & Apply Neural Network */}
            {(neuralStatus?.network_stats?.positions_trained > 0 || stats.positions_trained > 0) && (
              <div className="glass rounded-[32px] p-8 shadow-xl border-emerald-500/20 bg-emerald-500/5">
                <div className="flex items-center gap-3 mb-6 text-white">
                  <span className="text-emerald-400">💾</span>
                  <h3 className="font-bold text-xl">Apply to Bot</h3>
                </div>
                
                <div className="space-y-4">
                  <div className="space-y-2">
                    <div className="flex justify-between text-sm">
                      <label className="text-slate-400">Neural Network Blend</label>
                      <span className="font-mono text-emerald-400">{(neuralBlend * 100).toFixed(0)}%</span>
                    </div>
                    <input
                      type="range"
                      min="0"
                      max="100"
                      value={neuralBlend * 100}
                      onChange={(e) => updateNeuralBlend(parseInt(e.target.value) / 100)}
                      className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer"
                    />
                    <div className="flex justify-between text-xs text-slate-500">
                      <span>0% (Heuristic only)</span>
                      <span>100% (Neural only)</span>
                    </div>
                  </div>
                  
                  <p className="text-xs text-slate-400">
                    Controls how much the bot relies on the neural network vs traditional heuristics. 
                    Start with 50% to blend both approaches.
                  </p>
                  
                  <button
                    onClick={saveAndApplyNetwork}
                    disabled={isTraining}
                    className={`w-full py-3 rounded-2xl font-bold text-white transition-all ${
                      networkSaved 
                        ? 'bg-emerald-800 cursor-default' 
                        : 'bg-emerald-600 hover:bg-emerald-500'
                    } disabled:opacity-50`}
                  >
                    {networkSaved ? '✓ Saved & Applied!' : '💾 Save & Apply to Bot'}
                  </button>
                  
                  {networkEnabled && (
                    <div className="flex items-center gap-2 p-3 bg-emerald-500/10 rounded-xl border border-emerald-500/20">
                      <div className="w-2 h-2 rounded-full bg-emerald-400" />
                      <span className="text-sm text-emerald-300">Neural network active on Lichess bot</span>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* Position Evaluator */}
            <div className="glass rounded-[32px] p-8 shadow-xl border-blue-500/20 bg-blue-500/5">
              <div className="flex items-center gap-3 mb-6 text-white">
                <span className="text-blue-400">🔍</span>
                <h3 className="font-bold text-xl">Test Evaluation</h3>
              </div>
              <div className="space-y-4">
                <div className="space-y-2">
                  <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">FEN Position</label>
                  <input
                    type="text"
                    value={testFen}
                    onChange={(e) => setTestFen(e.target.value)}
                    className="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white font-mono text-xs"
                    placeholder="Enter FEN..."
                  />
                </div>
                <button
                  onClick={evaluatePosition}
                  className="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-2xl font-bold text-white transition-all"
                >
                  Evaluate Position
                </button>
                {evaluation && (
                  <div className="p-4 bg-slate-950/50 rounded-xl space-y-2">
                    <div className="flex justify-between">
                      <span className="text-slate-400">Score</span>
                      <span className={`font-mono font-bold ${evaluation.evaluation > 0 ? 'text-green-400' : evaluation.evaluation < 0 ? 'text-red-400' : 'text-slate-400'}`}>
                        {evaluation.evaluation > 0 ? '+' : ''}{evaluation.evaluation.toFixed(4)}
                      </span>
                    </div>
                    <p className="text-xs text-slate-400">{evaluation.interpretation}</p>
                  </div>
                )}
              </div>
            </div>

            {/* How Neural Networks Work */}
            <div className="glass rounded-[32px] p-8 shadow-xl border-purple-500/20 bg-purple-500/5">
              <div className="flex items-center gap-3 mb-6 text-white">
                <span className="text-purple-400">📖</span>
                <h3 className="font-bold text-xl">How It Works</h3>
              </div>
              <div className="space-y-4 text-sm text-slate-300">
                <div className="p-3 bg-slate-950/50 rounded-xl border border-white/5">
                  <div className="font-bold text-purple-400 mb-1">Input Layer (768 neurons)</div>
                  <p className="text-xs text-slate-400">Each square × each piece type = 768 inputs. The network "sees" the board as a pattern of 1s and 0s.</p>
                </div>
                <div className="p-3 bg-slate-950/50 rounded-xl border border-white/5">
                  <div className="font-bold text-purple-400 mb-1">Hidden Layers (256 → 64)</div>
                  <p className="text-xs text-slate-400">These layers learn patterns: piece coordination, pawn structure, king safety. Each neuron detects a specific feature.</p>
                </div>
                <div className="p-3 bg-slate-950/50 rounded-xl border border-white/5">
                  <div className="font-bold text-purple-400 mb-1">Output (1 neuron)</div>
                  <p className="text-xs text-slate-400">A single value from -1 to +1. Positive = white advantage, negative = black advantage.</p>
                </div>
                <div className="p-3 bg-slate-950/50 rounded-xl border border-white/5">
                  <div className="font-bold text-purple-400 mb-1">Learning Process</div>
                  <p className="text-xs text-slate-400">After each game, we label every position with the outcome. The network adjusts weights to predict winners better.</p>
                </div>
              </div>
            </div>

            {/* Training Data Stats */}
            <div className="glass rounded-[32px] p-8 shadow-xl">
              <div className="flex items-center gap-3 mb-6 text-white">
                <span className="text-emerald-400">📁</span>
                <h3 className="font-bold text-xl">Training Data</h3>
              </div>
              <div className="space-y-3 text-sm">
                <div className="flex justify-between">
                  <span className="text-slate-400">Total Games</span>
                  <span className="font-mono text-emerald-400">{neuralStatus?.data_stats?.total_games || dataStats.total_games || 0}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">Total Positions</span>
                  <span className="font-mono text-emerald-400">{neuralStatus?.data_stats?.total_positions || dataStats.total_positions || 0}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">White Wins</span>
                  <span className="font-mono text-emerald-400">{neuralStatus?.data_stats?.outcomes?.white_win || dataStats.outcomes?.white_win || 0}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">Black Wins</span>
                  <span className="font-mono text-emerald-400">{neuralStatus?.data_stats?.outcomes?.black_win || dataStats.outcomes?.black_win || 0}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">Draws</span>
                  <span className="font-mono text-emerald-400">{neuralStatus?.data_stats?.outcomes?.draw || dataStats.outcomes?.draw || 0}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const EngineArena = ({ config }) => {
      const [isSimulating, setIsSimulating] = useState(false);
      const [nodes, setNodes] = useState(0);
      const [evalScore, setEvalScore] = useState(0.0);
      const [logs, setLogs] = useState([]);
      const logEndRef = useRef(null);

      useEffect(() => {
        logEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [logs]);

      const addLog = (msg) => {
        setLogs(prev => [...prev.slice(-15), msg]);
      };

      const startTest = () => {
        setIsSimulating(true);
        setLogs([]);
        setNodes(0);
        setEvalScore(0.0);

        addLog("> UCI ok");
        addLog("> position startpos moves e2e4 e7e5");

        let n = 0;
        const interval = setInterval(() => {
          const increment = Math.floor(Math.random() * 50000);
          n += increment;
          setNodes(n);
          setEvalScore(prev => prev + (Math.random() - 0.5) * 0.1);
          if (Math.random() > 0.8) {
            addLog(`info depth ${config.search_depth} nodes ${n} score cp ${Math.floor(evalScore * 100)} pv g1f3`);
          }
        }, 200);

        setTimeout(() => {
          clearInterval(interval);
          setIsSimulating(false);
          addLog("bestmove g1f3");
        }, 4000);
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
          <div className="lg:col-span-7">
            <div className="glass rounded-[48px] p-10 aspect-square flex flex-col items-center justify-center relative overflow-hidden bg-slate-900/40">
              <div className="text-center space-y-8 relative z-10">
                {isSimulating ? (
                  <div className="flex flex-col items-center gap-6">
                    <div className="relative">
                      <div className="w-32 h-32 rounded-full border-4 border-indigo-500/10 border-t-indigo-500 animate-spin" />
                      <span className="text-indigo-400 font-bold text-3xl">CPU</span>
                    </div>
                    <div className="mono text-4xl font-bold text-white tracking-tighter">{(nodes / 1000).toFixed(1)}k Nodes</div>
                    <p className="text-xs uppercase tracking-[0.2em] text-slate-500 font-bold">Search Horizon: Depth {config.search_depth}</p>
                  </div>
                ) : (
                  <div className="space-y-8">
                    <span className="text-slate-700 font-bold text-5xl mx-auto">⚔</span>
                    <button
                      onClick={startTest}
                      className="px-12 py-5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-[24px] font-bold text-xl flex items-center gap-3 shadow-xl shadow-indigo-600/20 transition-all active:scale-95"
                    >
                      <span className="text-indigo-400 font-bold">▶</span> Start Simulation
                    </button>
                  </div>
                )}
              </div>

              <div className="absolute right-10 top-1/2 -translate-y-1/2 w-4 h-[60%] bg-slate-950/80 rounded-full overflow-hidden border border-white/10 p-1">
                <div
                  style={{ height: `${50 + (evalScore * 10)}%` }}
                  className={`w-full rounded-full transition-all duration-700 ${evalScore >= 0 ? 'bg-indigo-500' : 'bg-red-500'}`}
                />
              </div>
            </div>
          </div>
          <div className="lg:col-span-5 space-y-6">
            <div className="glass rounded-[32px] p-8 h-[400px] flex flex-col bg-black/20">
              <h3 className="font-bold text-sm uppercase tracking-widest mb-6 flex items-center gap-3 text-slate-400">
                <span className="text-indigo-400">›</span> UCI Engine Output
              </h3>
              <div className="flex-1 overflow-y-auto space-y-1 mono text-[11px] text-slate-400 custom-scrollbar">
                {logs.length === 0 && <div className="italic text-slate-600">Waiting for engine start...</div>}
                {logs.map((log, i) => (
                  <div key={i} className="flex gap-2">
                    <span className="text-indigo-500 shrink-0 opacity-50">›</span>
                    <span>{log}</span>
                  </div>
                ))}
                <div ref={logEndRef} />
              </div>
            </div>

            <div className="glass rounded-[32px] p-6 bg-indigo-500/5 border-indigo-500/10">
              <div className="flex justify-between items-center">
                <span className="text-xs font-bold uppercase tracking-widest text-slate-500">Live Evaluation</span>
                <span className={`mono text-sm font-bold ${isSimulating ? 'text-indigo-400' : 'text-slate-600'}`}>
                  {isSimulating ? (evalScore >= 0 ? '+' : '') + evalScore.toFixed(2) : '0.00'}
                </span>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- MAIN APP ---

    const DEFAULT_CONFIG = {
      name: "New Recruit",
      piece_values: { pawn: 100, knight: 320, bishop: 330, rook: 500, queen: 900 },
      mobility_weight: 10,
      king_safety: 20,
      search_depth: 4
    };

    const App = () => {
      const [activeView, setActiveView] = useState('learn');
      const [config, setConfig] = useState(DEFAULT_CONFIG);

      return (
        <div className="min-h-screen flex flex-col bg-[#020617] text-slate-100">
          <nav className="glass sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-600/30">
                <span className="text-white font-bold text-lg">CM</span>
              </div>
              <div>
                <h1 className="text-xl font-bold tracking-tight text-white">ChessMaster <span className="text-indigo-400">Architect</span></h1>
                <p className="text-[10px] uppercase tracking-widest text-slate-500 font-bold">AI Training Environment</p>
              </div>
            </div>

            <div className="flex gap-2 bg-slate-900/50 p-1 rounded-2xl border border-white/5">
              <NavButton active={activeView === 'learn'} onClick={() => setActiveView('learn')} icon={<span>A</span>} label="Academy" />
              <NavButton active={activeView === 'tune'} onClick={() => setActiveView('tune')} icon={<span>⚙</span>} label="Lab" />
              <NavButton active={activeView === 'train'} onClick={() => setActiveView('train')} icon={<span>🧬</span>} label="Train" />
              <NavButton active={activeView === 'neural'} onClick={() => setActiveView('neural')} icon={<span>🧠</span>} label="Neural" />
              <NavButton active={activeView === 'arena'} onClick={() => setActiveView('arena')} icon={<span>▶</span>} label="Arena" />
            </div>

            <div className="hidden md:flex items-center gap-4">
              <a href="https://github.com/IllI/chess_bot" target="_blank" className="text-slate-400 hover:text-white transition-colors">
                <span className="font-mono text-sm">GH</span>
              </a>
              <div className="h-8 w-[1px] bg-white/10" />
              <div className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-green-500/10 border border-green-500/20">
                <div className="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse" />
                <span className="text-[10px] font-bold text-green-500 uppercase">Engine Online</span>
              </div>
            </div>
          </nav>

          <main className="flex-1 p-6 max-w-7xl mx-auto w-full">
            {activeView === 'learn' && <LearningCenter onContinue={() => setActiveView('tune')} />}
            {activeView === 'tune' && <TuningLab config={config} setConfig={setConfig} />}
            {activeView === 'train' && <TrainingLab config={config} setConfig={setConfig} />}
            {activeView === 'neural' && <NeuralLab config={config} setConfig={setConfig} />}
            {activeView === 'arena' && <EngineArena config={config} />}
          </main>

          <footer className="py-6 px-8 border-t border-white/5 bg-slate-950/50 text-slate-500 text-xs flex justify-between">
            <p> 2024 Chess Bot Instructional Platform</p>
            <div className="flex gap-6">
              <button className="hover:text-slate-300">Privacy</button>
              <button className="hover:text-slate-300">Docs</button>
              <button className="hover:text-slate-300">API Status</button>
            </div>
          </footer>
        </div>
      );
    };

    const NavButton = ({ active, onClick, icon, label }) => (
      <button
        onClick={onClick}
        className={`flex items-center gap-2 px-4 py-2 rounded-xl transition-all duration-300 ${active
          ? 'bg-indigo-600 text-white shadow-xl shadow-indigo-600/20'
          : 'text-slate-400 hover:text-white hover:bg-white/5'
          }`}
      >
        {icon}
        <span className="text-sm font-semibold">{label}</span>
      </button>
    );

    const rootElement = document.getElementById('root');
    if (rootElement) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    }
  </script>
</body>

</html>
