<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChessMaster AI Tutor: Architect Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #020617;
      color: #f1f5f9;
      margin: 0;
      overflow-x: hidden;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .glass {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #6366f1;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
      margin-top: -6px;
      border: 2px solid white;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #1e293b;
      border-radius: 3px;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.3);
      border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.5);
    }

    .shimmer {
      background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.05), transparent);
      background-size: 200% 100%;
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom": "https://esm.sh/react-dom@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
      }
    }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react,typescript" data-type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import ReactDOM from 'react-dom/client';

    // --- COMPONENTS ---

    const LearningCenter = ({ onContinue }) => {
      return (
        <div className="max-w-5xl mx-auto py-12 space-y-20">
          <div className="text-center space-y-8">
            <div
              className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-bold uppercase tracking-widest mb-4"
            >
              <span className="text-indigo-400">★</span> AI Fundamentals 101
            </div>

            <h1 className="text-6xl md:text-7xl font-black tracking-tight text-white leading-tight">
              Master the <span className="text-indigo-500">Logic</span> <br /> behind the Bot.
            </h1>
            <p className="text-xl text-slate-400 max-w-2xl mx-auto leading-relaxed">
              Chess AI is a perfect sandbox to understand how machines "see" complexity through mathematical scoring and tree search.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <ConceptCard icon={<span className="text-indigo-400 font-bold">CPU</span>} title="Heuristics" description="Position evaluation logic: transforming a board state into a single numeric score." />
            <ConceptCard icon={<span className="text-emerald-400 font-bold">Tree</span>} title="Search Tree" description="Minimax and Alpha-Beta: how computers look ahead into millions of future possibilities." />
            <ConceptCard icon={<span className="text-red-400 font-bold">⊕</span>} title="Weight Tuning" description="Balancing priorities: Should the bot value raw material or positional mobility more?" />
          </div>

          <div className="glass rounded-[40px] p-12 flex flex-col md:flex-row items-center justify-between gap-12 bg-indigo-600/5 border-indigo-600/10 relative overflow-hidden">
            <div className="absolute top-0 right-0 w-64 h-64 bg-indigo-500/5 blur-[100px] pointer-events-none" />
            <div className="space-y-4">
              <h3 className="text-3xl font-bold text-white">Ready to Architect?</h3>
              <p className="text-slate-400 text-lg">Initialize your configuration and enter the Tuning Lab.</p>
            </div>
            <button
              onClick={onContinue}
              className="px-10 py-5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-3xl font-bold text-xl flex items-center gap-4 shadow-2xl shadow-indigo-600/30 transition-all active:scale-95 group"
            >
              Enter Lab <span className="inline-block">→</span>
            </button>
          </div>
        </div>
      );
    };

    const ConceptCard = ({ icon, title, description }) => (
      <div className="glass p-8 rounded-[36px] bg-slate-900/30 border-white/5 hover:border-white/10 transition-all">
        <div className="p-4 bg-slate-950 rounded-2xl w-fit mb-6 shadow-inner">{icon}</div>
        <h4 className="text-lg font-bold mb-3 text-white">{title}</h4>
        <p className="text-slate-400 text-sm leading-relaxed">{description}</p>
      </div>
    );

    // ============== EDUCATIONAL VISUALIZATION COMPONENTS ==============

    // Neural Network Architecture Visualization
    const NeuralNetworkDiagram = ({ inputSize = 833, hidden1 = 512, hidden2 = 128, hidden3 = 32, output = 1 }) => {
      const layers = [
        { name: 'Input', size: inputSize, color: 'cyan', neurons: 6 },
        { name: 'Hidden 1', size: hidden1, color: 'purple', neurons: 5 },
        { name: 'Hidden 2', size: hidden2, color: 'purple', neurons: 4 },
        { name: 'Hidden 3', size: hidden3, color: 'purple', neurons: 3 },
        { name: 'Output', size: output, color: 'emerald', neurons: 1 }
      ];

      return (
        <div className="p-6 bg-slate-950/50 rounded-2xl border border-white/5">
          <div className="flex items-center justify-between mb-4">
            <h4 className="font-bold text-white">Network Architecture</h4>
            <span className="text-xs text-slate-500 font-mono">{inputSize}→{hidden1}→{hidden2}→{hidden3}→{output}</span>
          </div>
          <div className="flex items-center justify-between gap-2">
            {layers.map((layer, i) => (
              <div key={i} className="flex flex-col items-center gap-2">
                <div className="flex flex-col gap-1">
                  {Array(layer.neurons).fill(0).map((_, j) => (
                    <div 
                      key={j} 
                      className={`w-4 h-4 rounded-full bg-${layer.color}-500/30 border border-${layer.color}-500/50`}
                      style={{ 
                        backgroundColor: `rgba(${layer.color === 'cyan' ? '34,211,238' : layer.color === 'purple' ? '168,85,247' : '52,211,153'}, 0.3)`,
                        borderColor: `rgba(${layer.color === 'cyan' ? '34,211,238' : layer.color === 'purple' ? '168,85,247' : '52,211,153'}, 0.5)`
                      }}
                    />
                  ))}
                  {layer.neurons < 6 && <div className="text-[8px] text-slate-600">...</div>}
                </div>
                <div className="text-center">
                  <div className="text-[10px] font-bold text-slate-400">{layer.name}</div>
                  <div className="text-[9px] font-mono text-slate-600">{layer.size}</div>
                </div>
                {i < layers.length - 1 && (
                  <div className="absolute" style={{ left: `${(i + 0.5) * 20}%` }}>
                    <span className="text-slate-700">→</span>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    };

    // Mathematical Formula Display Component
    const MathFormula = ({ title, formula, description, variables }) => {
      const [showDetails, setShowDetails] = useState(false);
      
      return (
        <div className="p-4 bg-slate-950/50 rounded-xl border border-white/5 hover:border-white/10 transition-all">
          <div 
            className="flex items-center justify-between cursor-pointer"
            onClick={() => setShowDetails(!showDetails)}
          >
            <div className="flex items-center gap-3">
              <span className="text-amber-400">∑</span>
              <span className="font-bold text-white text-sm">{title}</span>
            </div>
            <span className="text-slate-500 text-xs">{showDetails ? '▼' : '▶'}</span>
          </div>
          
          <div className="mt-3 p-3 bg-slate-900 rounded-lg font-mono text-sm text-cyan-300 overflow-x-auto">
            {formula}
          </div>
          
          {showDetails && (
            <div className="mt-3 space-y-2">
              <p className="text-xs text-slate-400">{description}</p>
              {variables && (
                <div className="grid grid-cols-2 gap-2 mt-2">
                  {variables.map((v, i) => (
                    <div key={i} className="flex items-center gap-2 text-xs">
                      <span className="font-mono text-purple-400">{v.symbol}</span>
                      <span className="text-slate-500">=</span>
                      <span className="text-slate-400">{v.meaning}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // Training Progress Chart (Simple Bar Chart)
    const TrainingChart = ({ history = [], maxPoints = 20 }) => {
      const data = history.slice(-maxPoints);
      const maxLoss = Math.max(...data.map(d => d.loss || 0), 0.5);
      
      if (data.length === 0) {
        return (
          <div className="p-6 bg-slate-950/50 rounded-2xl border border-white/5 text-center">
            <div className="text-slate-600 text-sm">No training data yet</div>
            <div className="text-slate-700 text-xs mt-1">Start training to see loss curve</div>
          </div>
        );
      }
      
      return (
        <div className="p-4 bg-slate-950/50 rounded-2xl border border-white/5">
          <div className="flex items-center justify-between mb-3">
            <h4 className="font-bold text-white text-sm">Loss Over Time</h4>
            <span className="text-xs text-slate-500 font-mono">Last {data.length} epochs</span>
          </div>
          <div className="flex items-end gap-1 h-24">
            {data.map((d, i) => (
              <div 
                key={i}
                className="flex-1 bg-gradient-to-t from-purple-600 to-purple-400 rounded-t opacity-80 hover:opacity-100 transition-all cursor-pointer group relative"
                style={{ height: `${Math.max(5, (d.loss / maxLoss) * 100)}%` }}
                title={`Epoch ${d.epoch}: Loss ${d.loss?.toFixed(6)}`}
              >
                <div className="absolute -top-8 left-1/2 -translate-x-1/2 bg-slate-800 px-2 py-1 rounded text-[9px] font-mono text-white opacity-0 group-hover:opacity-100 whitespace-nowrap z-10">
                  {d.loss?.toFixed(4)}
                </div>
              </div>
            ))}
          </div>
          <div className="flex justify-between mt-2 text-[9px] text-slate-600">
            <span>Epoch {data[0]?.epoch || 1}</span>
            <span>Epoch {data[data.length - 1]?.epoch || 1}</span>
          </div>
        </div>
      );
    };

    // Reward Signal Visualization
    const RewardSignalViz = ({ materialChange = 0, gameOutcome = 0.5, isCapture = false }) => {
      const materialSignal = Math.max(-1, Math.min(1, materialChange / 2000));
      const outcomeSignal = gameOutcome * 2 - 1;
      
      // Calculate weights based on capture
      let materialWeight, outcomeWeight;
      if (isCapture) {
        if (materialChange < -200) {
          materialWeight = 0.9;
          outcomeWeight = 0.1;
        } else if (materialChange > 200) {
          materialWeight = 0.85;
          outcomeWeight = 0.15;
        } else {
          materialWeight = 0.7;
          outcomeWeight = 0.3;
        }
      } else {
        materialWeight = 0.3;
        outcomeWeight = 0.7;
      }
      
      const finalSignal = materialWeight * materialSignal + outcomeWeight * outcomeSignal;
      
      return (
        <div className="p-4 bg-slate-950/50 rounded-xl border border-white/5">
          <h4 className="font-bold text-white text-sm mb-3">Reward Signal Calculation</h4>
          
          <div className="space-y-3">
            {/* Material Signal */}
            <div className="space-y-1">
              <div className="flex justify-between text-xs">
                <span className="text-slate-400">Material Signal</span>
                <span className="font-mono text-cyan-400">{materialSignal.toFixed(3)}</span>
              </div>
              <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                <div 
                  className={`h-full transition-all ${materialSignal >= 0 ? 'bg-emerald-500' : 'bg-red-500'}`}
                  style={{ 
                    width: `${Math.abs(materialSignal) * 50}%`,
                    marginLeft: materialSignal >= 0 ? '50%' : `${50 - Math.abs(materialSignal) * 50}%`
                  }}
                />
              </div>
              <div className="text-[9px] text-slate-600 font-mono">
                weight: {(materialWeight * 100).toFixed(0)}%
              </div>
            </div>
            
            {/* Outcome Signal */}
            <div className="space-y-1">
              <div className="flex justify-between text-xs">
                <span className="text-slate-400">Outcome Signal</span>
                <span className="font-mono text-purple-400">{outcomeSignal.toFixed(3)}</span>
              </div>
              <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                <div 
                  className={`h-full transition-all ${outcomeSignal >= 0 ? 'bg-emerald-500' : 'bg-red-500'}`}
                  style={{ 
                    width: `${Math.abs(outcomeSignal) * 50}%`,
                    marginLeft: outcomeSignal >= 0 ? '50%' : `${50 - Math.abs(outcomeSignal) * 50}%`
                  }}
                />
              </div>
              <div className="text-[9px] text-slate-600 font-mono">
                weight: {(outcomeWeight * 100).toFixed(0)}%
              </div>
            </div>
            
            {/* Final Signal */}
            <div className="pt-2 border-t border-white/5">
              <div className="flex justify-between text-xs">
                <span className="text-white font-bold">Final Target</span>
                <span className={`font-mono font-bold ${finalSignal >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                  {finalSignal >= 0 ? '+' : ''}{finalSignal.toFixed(3)}
                </span>
              </div>
              <div className="mt-1 p-2 bg-slate-900 rounded text-[10px] font-mono text-slate-400">
                target = {materialWeight.toFixed(2)} × {materialSignal.toFixed(3)} + {outcomeWeight.toFixed(2)} × {outcomeSignal.toFixed(3)}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Backpropagation Visualization
    const BackpropViz = ({ loss = 0.1, learningRate = 0.01 }) => {
      const gradient = 2 * loss; // Simplified MSE gradient
      const weightUpdate = learningRate * gradient;
      
      return (
        <div className="p-4 bg-slate-950/50 rounded-xl border border-white/5">
          <h4 className="font-bold text-white text-sm mb-3">Backpropagation Step</h4>
          
          <div className="space-y-4">
            {/* Loss */}
            <div className="flex items-center gap-3">
              <div className="w-16 text-xs text-slate-400">Loss (L)</div>
              <div className="flex-1 h-6 bg-slate-800 rounded relative overflow-hidden">
                <div 
                  className="h-full bg-red-500/50"
                  style={{ width: `${Math.min(100, loss * 200)}%` }}
                />
                <span className="absolute inset-0 flex items-center justify-center text-[10px] font-mono text-white">
                  {loss.toFixed(6)}
                </span>
              </div>
            </div>
            
            {/* Gradient */}
            <div className="flex items-center gap-3">
              <div className="w-16 text-xs text-slate-400">∂L/∂w</div>
              <div className="flex-1 h-6 bg-slate-800 rounded relative overflow-hidden">
                <div 
                  className="h-full bg-amber-500/50"
                  style={{ width: `${Math.min(100, gradient * 100)}%` }}
                />
                <span className="absolute inset-0 flex items-center justify-center text-[10px] font-mono text-white">
                  {gradient.toFixed(6)}
                </span>
              </div>
            </div>
            
            {/* Weight Update */}
            <div className="flex items-center gap-3">
              <div className="w-16 text-xs text-slate-400">Δw</div>
              <div className="flex-1 h-6 bg-slate-800 rounded relative overflow-hidden">
                <div 
                  className="h-full bg-emerald-500/50"
                  style={{ width: `${Math.min(100, weightUpdate * 1000)}%` }}
                />
                <span className="absolute inset-0 flex items-center justify-center text-[10px] font-mono text-white">
                  -{weightUpdate.toFixed(6)}
                </span>
              </div>
            </div>
            
            {/* Formula */}
            <div className="p-2 bg-slate-900 rounded text-[10px] font-mono text-cyan-300">
              w_new = w_old - η × ∂L/∂w = w - {learningRate} × {gradient.toFixed(4)}
            </div>
          </div>
        </div>
      );
    };

    // Activation Function Visualizer
    const ActivationViz = ({ type = 'leaky_relu' }) => {
      const points = [];
      for (let x = -3; x <= 3; x += 0.2) {
        let y;
        if (type === 'leaky_relu') {
          y = x > 0 ? x : 0.01 * x;
        } else if (type === 'tanh') {
          y = Math.tanh(x);
        } else if (type === 'sigmoid') {
          y = 1 / (1 + Math.exp(-x));
        }
        points.push({ x, y });
      }
      
      const maxY = Math.max(...points.map(p => Math.abs(p.y)));
      
      return (
        <div className="p-4 bg-slate-950/50 rounded-xl border border-white/5">
          <div className="flex items-center justify-between mb-3">
            <h4 className="font-bold text-white text-sm">Activation: {type === 'leaky_relu' ? 'Leaky ReLU' : type === 'tanh' ? 'Tanh' : 'Sigmoid'}</h4>
          </div>
          
          <div className="relative h-32 bg-slate-900 rounded-lg overflow-hidden">
            {/* Grid */}
            <div className="absolute inset-0 flex items-center justify-center">
              <div className="w-px h-full bg-slate-700" />
            </div>
            <div className="absolute inset-0 flex items-center">
              <div className="w-full h-px bg-slate-700" />
            </div>
            
            {/* Curve */}
            <svg className="absolute inset-0 w-full h-full">
              <polyline
                fill="none"
                stroke="rgb(34, 211, 238)"
                strokeWidth="2"
                points={points.map((p, i) => {
                  const x = ((p.x + 3) / 6) * 100;
                  const y = 50 - (p.y / (maxY || 1)) * 40;
                  return `${x}%,${y}%`;
                }).join(' ')}
              />
            </svg>
            
            {/* Labels */}
            <div className="absolute bottom-1 left-2 text-[8px] text-slate-600">-3</div>
            <div className="absolute bottom-1 right-2 text-[8px] text-slate-600">+3</div>
          </div>
          
          <div className="mt-2 p-2 bg-slate-900 rounded text-[10px] font-mono text-slate-400">
            {type === 'leaky_relu' && 'f(x) = max(0.01x, x)'}
            {type === 'tanh' && 'f(x) = (eˣ - e⁻ˣ) / (eˣ + e⁻ˣ)'}
            {type === 'sigmoid' && 'f(x) = 1 / (1 + e⁻ˣ)'}
          </div>
        </div>
      );
    };

    // Educational Modal Component
    const EducationalModal = ({ isOpen, onClose, title, children }) => {
      if (!isOpen) return null;
      
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose} />
          <div className="relative glass rounded-[32px] p-8 max-w-2xl max-h-[80vh] overflow-y-auto custom-scrollbar">
            <button 
              onClick={onClose}
              className="absolute top-4 right-4 text-slate-400 hover:text-white text-xl"
            >
              ×
            </button>
            <h2 className="text-2xl font-bold text-white mb-6">{title}</h2>
            {children}
          </div>
        </div>
      );
    };

    // Piece Value Comparison Chart
    const PieceValueChart = () => {
      const pieces = [
        { name: 'Pawn', symbol: '♟', value: 100, color: 'slate' },
        { name: 'Knight', symbol: '♞', value: 320, color: 'blue' },
        { name: 'Bishop', symbol: '♝', value: 330, color: 'purple' },
        { name: 'Rook', symbol: '♜', value: 500, color: 'amber' },
        { name: 'Queen', symbol: '♛', value: 900, color: 'red' },
      ];
      
      const maxValue = 900;
      
      return (
        <div className="p-4 bg-slate-950/50 rounded-xl border border-white/5">
          <h4 className="font-bold text-white text-sm mb-4">Standard Piece Values (Centipawns)</h4>
          <div className="space-y-2">
            {pieces.map((piece, i) => (
              <div key={i} className="flex items-center gap-3">
                <span className="text-2xl w-8">{piece.symbol}</span>
                <div className="flex-1">
                  <div className="flex justify-between text-xs mb-1">
                    <span className="text-slate-400">{piece.name}</span>
                    <span className="font-mono text-cyan-400">{piece.value}</span>
                  </div>
                  <div className="h-3 bg-slate-800 rounded-full overflow-hidden">
                    <div 
                      className="h-full bg-gradient-to-r from-cyan-600 to-cyan-400 rounded-full"
                      style={{ width: `${(piece.value / maxValue) * 100}%` }}
                    />
                  </div>
                </div>
              </div>
            ))}
          </div>
          <div className="mt-3 p-2 bg-slate-900 rounded text-[10px] font-mono text-slate-400">
            Material = Σ (piece_count × piece_value)
          </div>
        </div>
      );
    };

    // ============== END EDUCATIONAL COMPONENTS ==============

    const TuningLab = ({ config, setConfig }) => {
      const [aiReport, setAiReport] = useState(null);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [saveMessage, setSaveMessage] = useState(null);
      const [activeBotId, setActiveBotId] = useState("aggressive_v1");
      const [showChallengeModal, setShowChallengeModal] = useState(false);

      // Fetch saved config on mount
      useEffect(() => {
        // Load lab config directly (persisted to disk)
        fetch('http://localhost:5050/api/lab/config')
          .then(res => res.json())
          .then(data => {
            if (data.ok && data.config) {
              setConfig({
                name: 'lab_config',
                ...data.config
              });
            }
          })
          .catch(err => console.warn('Could not fetch lab config:', err));
      }, []);

      const updateWeight = (category, key, value) => {
        const next = { ...config };
        if (key && typeof next[category] === 'object') {
          next[category][key] = value;
        } else {
          next[category] = value;
        }
        setConfig(next);
      };

      const getAIAnalysis = async () => {
        setIsAnalyzing(true);
        try {
          // Local, non-networked stub for educational use only
          const summary = [
            `Personality: ${config.mobility_weight > 12 ? 'hyper-aggressive mobility hunter' : 'balanced classical engine'} with material baseline tuned to ${config.piece_values.queen} for the queen.`,
            `Tactical bias: values ${config.mobility_weight > 12 ? 'initiative and piece activity over static structure' : 'solid material edges and king safety'}.`,
            `Search profile: fixed depth ${config.search_depth} plies; encourage students to reason about time vs depth trade-offs.`
          ];
          setAiReport(summary.map(point => `• ${point}`).join('\n'));
        } catch (e) {
          console.error(e);
          setAiReport("Architect helper stub is offline.");
        } finally {
          setIsAnalyzing(false);
        }

      const saveConfigToBot = async () => {
        setIsSaving(true);
        setSaveMessage(null);
        try {
          const response = await fetch('http://localhost:5050/api/lab/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ config })

          const data = await response.json().catch(() => ({}));

          if (!response.ok || !data.ok) {

            setSaveMessage(`Save failed: ${msg}`);
            return;

          setTimeout(() => setSaveMessage(null), 3000);

                        </div>
                        <input
                          type="range" min="0" max="1500" step="10" value={val}
                          onChange={(e) => updateWeight('piece_values', piece, parseInt(e.target.value))}
                          className="w-full accent-indigo-500"
                        />
                      </div>
                    ))}
                  </div>
                </section>

                <section className="space-y-10">
                  <div className="flex items-center gap-3 border-b border-white/5 pb-4">
                    <span className="text-emerald-400 font-bold">⚖</span>
                    <h3 className="text-xs font-black uppercase tracking-widest text-slate-400">Strategic Weighting</h3>
                  </div>

                  <div className="space-y-8">
                    <div className="space-y-4">
                      <div className="flex justify-between text-sm font-bold text-slate-300">
                        <span>Mobility</span>
                        <span className="mono text-emerald-400">+{config.mobility_weight}%</span>
                      </div>
                      <input
                        type="range" min="0" max="100" step="1" value={config.mobility_weight}
                        onChange={(e) => updateWeight('mobility_weight', null, parseInt(e.target.value))}

                    <div className="space-y-4">
                      <div className="flex justify-between text-sm font-bold text-slate-300">
                        <span>King Safety Penalty</span>
                        <span className="mono text-red-400">-{config.king_safety}</span>
                      </div>
                      <input
                        type="range" min="0" max="200" step="5" value={config.king_safety}
                        onChange={(e) => updateWeight('king_safety', null, parseInt(e.target.value))}
                        className="w-full accent-red-500"
                      />
                    </div>

                    <div className="p-6 bg-slate-950/50 rounded-3xl border border-white/5 mt-8">
                      <div className="flex justify-between text-sm font-bold text-slate-300 mb-4">
                        <span>Search Depth</span>
                        <span className="mono text-indigo-400">{config.search_depth} Layers</span>
                      </div>
                      <input
                        type="range" min="1" max="10" step="1" value={config.search_depth}
                        onChange={(e) => updateWeight('search_depth', null, parseInt(e.target.value))}
                        className="w-full accent-indigo-400"
                      />
                    </div>
                  </div>
                </section>
              </div>
            </div>
          </div>

          <div className="lg:col-span-4 space-y-6">
            <div className="glass rounded-[32px] p-8 shadow-xl border-indigo-500/20 bg-indigo-500/5 flex flex-col h-fit space-y-4">
              <div className="flex items-center gap-3 mb-6 text-white">
                <span className="text-indigo-400">★</span>

                <div className="text-center space-y-6">

                  </p>

                  <div className="bg-slate-950/80 rounded-2xl p-6 text-left space-y-4 border border-white/5">
                    <h4 className="font-bold text-emerald-400 flex items-center gap-2">
                      <span>⚔</span> Challenge Your Bot

                      </li>
                      <li className="flex gap-3">
                        <span className="text-indigo-400 font-bold">2.</span>
                        <span>Click the <span className="font-bold text-white">Challenge</span> button on the profile</span>

                      <li className="flex gap-3">

                        <span>Select time control (Rapid 10+0 recommended) and start playing!</span>

                    >
                      <span>♟</span> Open Bot on Lichess <span>→</span>
                    </a>
                    <button
                      onClick={() => setShowChallengeModal(false)}
                      className="w-full py-3 bg-slate-800 hover:bg-slate-700 rounded-2xl font-medium text-slate-300 transition-all"
                    >
                      Continue Tuning
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // Live Chessboard Component
    const LiveChessboard = ({ fen, whiteId, blackId, moveCount, lastMove }) => {
      const defaultFen = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
      const currentFen = fen || defaultFen;
      
      // Parse FEN to get piece positions
      const parseFen = (fenString) => {
        const [position] = fenString.split(' ');
        const rows = position.split('/');
        const board = [];
        
        for (let row of rows) {
          const boardRow = [];
          for (let char of row) {
            if (isNaN(char)) {
              boardRow.push(char);
            } else {
              for (let i = 0; i < parseInt(char); i++) {
                boardRow.push(null);
              }
            }
          }
          board.push(boardRow);
        }
        return board;
      };
      
      // Get piece unicode symbol
      const getPieceSymbol = (piece) => {
        const symbols = {
          'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
          'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
        };
        return symbols[piece] || '';
      };
      
      // Parse last move to highlight squares
      const getHighlightSquares = (move) => {
        if (!move || move.length < 4) return { from: null, to: null };
        const files = 'abcdefgh';
        const fromFile = files.indexOf(move[0]);
        const fromRank = 8 - parseInt(move[1]);
        const toFile = files.indexOf(move[2]);
        const toRank = 8 - parseInt(move[3]);
        return {
          from: { row: fromRank, col: fromFile },
          to: { row: toRank, col: toFile }
        };
      };
      
      const board = parseFen(currentFen);
      const highlight = getHighlightSquares(lastMove);
      
      const isHighlighted = (row, col) => {
        if (!highlight.from && !highlight.to) return false;
        return (highlight.from?.row === row && highlight.from?.col === col) ||
               (highlight.to?.row === row && highlight.to?.col === col);
      };
      
      return (
        <div className="glass rounded-[32px] p-6 shadow-xl border-purple-500/20 bg-purple-500/5">
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-3 text-white">
              <span className="text-purple-400">♟</span>
              <h3 className="font-bold text-lg">Live Game</h3>
            </div>
            {moveCount > 0 && (
              <span className="text-xs font-mono text-purple-400 bg-purple-500/10 px-2 py-1 rounded-lg">
                Move {moveCount}
              </span>
            )}
          </div>
          
          {/* Player labels */}
          <div className="flex justify-between text-xs text-slate-400 mb-2 px-1">
            <span className="truncate max-w-[45%]">⚫ {blackId || 'Black'}</span>
          </div>
          
          {/* Chess board */}
          <div className="aspect-square bg-slate-950 rounded-xl overflow-hidden border border-white/10">
            <div className="grid grid-cols-8 grid-rows-8 h-full w-full">
              {board.map((row, rowIdx) =>
                row.map((piece, colIdx) => {
                  const isLight = (rowIdx + colIdx) % 2 === 0;
                  const highlighted = isHighlighted(rowIdx, colIdx);
                  return (
                    <div
                      key={`${rowIdx}-${colIdx}`}
                      className={`flex items-center justify-center text-2xl sm:text-3xl transition-colors ${
                        highlighted
                          ? 'bg-yellow-500/40'
                          : isLight
                            ? 'bg-amber-100/90'
                            : 'bg-amber-800/90'
                      }`}
                    >
                      <span className={piece && piece === piece.toUpperCase() ? 'text-white drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]' : 'text-slate-900'}>
                        {getPieceSymbol(piece)}
                      </span>
                    </div>
                  );
                })
              )}
            </div>
          </div>
          
          {/* Player labels */}
          <div className="flex justify-between text-xs text-slate-400 mt-2 px-1">
            <span className="truncate max-w-[45%]">⚪ {whiteId || 'White'}</span>
          </div>
          
          {/* Last move indicator */}
          {lastMove && (
            <div className="mt-3 text-center">
              <span className="text-xs text-slate-500">Last move: </span>
              <span className="text-xs font-mono text-purple-400">{lastMove}</span>
            </div>
          )}
        </div>
      );
    };

    // Training Lab Component
    const TrainingLab = ({ config, setConfig }) => {
      const [isTraining, setIsTraining] = useState(false);
      const [isPaused, setIsPaused] = useState(false);
      const [trainingStatus, setTrainingStatus] = useState(null);
      const [generations, setGenerations] = useState(10);
      const [populationSize, setPopulationSize] = useState(6);
      const [gamesPerMatch, setGamesPerMatch] = useState(4);
      const [logs, setLogs] = useState([]);
      const [currentGame, setCurrentGame] = useState(null);
      const [configApplied, setConfigApplied] = useState(false);
      const logEndRef = useRef(null);

      // Poll training status
      useEffect(() => {
        if (!isTraining) return;

        const interval = setInterval(() => {
          fetch('http://localhost:5050/api/training/status')
            .then(res => res.json())
            .then(data => {
              if (data.ok) {
                setTrainingStatus(data);
                if (data.session) {
                  const gen = data.session.current_generation;
                  const gamesInGen = data.games_in_generation || 0;
                  const totalGamesInGen = data.total_games_in_generation || 1;
                  const lastLog = logs[logs.length - 1];
                  
                  // Show game progress within generation
                  const progressMsg = `Gen ${gen}/${data.session.max_generations} - Games: ${gamesInGen}/${totalGamesInGen} - Best fitness: ${data.session.best_fitness?.toFixed(1) || 0}`;
                  if (!lastLog || !lastLog.includes(progressMsg.substring(0, 20))) {
                    addLog(progressMsg);
                  }
                  
                  if (data.session.status === 'completed' || data.session.status === 'stopped') {
                    setIsTraining(false);
                    addLog(`Training ${data.session.status}!`);
                  }
                }
              }
            })
            .catch(err => console.error('Status poll error:', err));
        }, 2000);

        return () => clearInterval(interval);
      }, [isTraining, logs]);

      // Poll current game state for live chessboard
      useEffect(() => {
        if (!isTraining) {
          setCurrentGame(null);
          return;
        }

        const gameInterval = setInterval(() => {
          fetch('http://localhost:5050/api/training/current-game')
            .then(res => res.json())
            .then(data => {
              if (data.ok && data.game) {
                setCurrentGame(data.game);
              } else {
                setCurrentGame(null);
              }
            })
            .catch(err => console.error('Game poll error:', err));
        }, 500);

        return () => clearInterval(gameInterval);
      }, [isTraining]);

      // Removed auto-scroll - it was scrolling the game preview out of view

      const addLog = (msg) => {
        const timestamp = new Date().toLocaleTimeString();
        setLogs(prev => [...prev.slice(-20), `[${timestamp}] ${msg}`]);
      };

      const startTraining = async () => {
        setLogs([]);
        addLog('Resetting previous session...');

        // Reset first to clear any stuck state
        try {
          await fetch('http://localhost:5050/api/training/reset', { method: 'POST' });
        } catch (e) {
          // Ignore reset errors
        }

        addLog('Initializing evolutionary training...');
        setIsTraining(true);
        setIsPaused(false);
        setTrainingStatus(null);
        setConfigApplied(false);

        try {
          const response = await fetch('http://localhost:5050/api/training/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              max_generations: generations,
              population_size: populationSize,
              games_per_match: gamesPerMatch
            })
          });
          const data = await response.json();
          if (data.ok) {
            addLog(`🧬 Evolution started!`);
            addLog(`Population: ${populationSize} unique configurations`);
            addLog(`Games per matchup: ${gamesPerMatch}`);
            addLog(`Target: ${generations} generations`);
            addLog('---');
            addLog('Self-play matches beginning...');
          } else {
            addLog(`❌ Error: ${data.error}`);
            setIsTraining(false);
          }
        } catch (e) {
          addLog(`❌ Connection error: ${e.message}`);
          setIsTraining(false);
        }
      };

      const stopTraining = async () => {
        addLog('Stopping training...');
        await fetch('http://localhost:5050/api/training/stop', { method: 'POST' });
        setIsTraining(false);
        setIsPaused(false);
      };

      const togglePause = async () => {
        if (isPaused) {
          await fetch('http://localhost:5050/api/training/resume', { method: 'POST' });
          addLog('Training resumed');
        } else {
          await fetch('http://localhost:5050/api/training/pause', { method: 'POST' });
          addLog('Training paused');
        }
        setIsPaused(!isPaused);
      };

      const applyBestConfig = () => {
        if (trainingStatus?.session?.best_config) {
          setConfig({
            ...config,
            ...trainingStatus.session.best_config
          });
          setConfigApplied(true);
          addLog('✅ Best configuration applied to your model!');
        }
      };

      const progress = trainingStatus?.session?.progress_percent || 0;
      const currentGen = trainingStatus?.session?.current_generation || 0;
      const maxGen = trainingStatus?.session?.max_generations || generations;
      const bestFitness = trainingStatus?.session?.best_fitness || 0;
      const gamesCompleted = trainingStatus?.games_completed || 0;
      const totalGames = trainingStatus?.total_games || 0;
      
      // Calculate actual progress based on games completed
      const actualProgress = totalGames > 0 ? Math.min(100, (gamesCompleted / totalGames) * 100) : 0;

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
          <div className="lg:col-span-7 space-y-6">
            <div className="glass rounded-[40px] p-10 shadow-2xl relative overflow-hidden bg-slate-900/40">
              <div className="absolute top-0 right-0 w-80 h-80 bg-purple-600/5 blur-[120px] pointer-events-none" />

              <div className="flex items-center justify-between mb-8">
                <div className="space-y-1">
                  <h2 className="text-3xl font-black text-white">Evolutionary Training</h2>
                  <p className="text-slate-500 font-medium">Self-play optimization through natural selection</p>
                </div>
                <div className="glass px-4 py-2 rounded-2xl border-purple-500/20">
                  <span className="text-[10px] font-bold uppercase tracking-[0.2em] text-purple-400">Phase 1</span>
                </div>
              </div>

              {/* Training Controls */}
              <div className="space-y-6 mb-8">
                <div className="grid grid-cols-3 gap-4">
                  <div className="space-y-2">
                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Generations</label>
                    <input
                      type="number" min="1" max="50" value={generations}
                      onChange={(e) => setGenerations(parseInt(e.target.value) || 10)}
                      disabled={isTraining}
                      className="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white font-mono disabled:opacity-50"
                    />
                  </div>
                  <div className="space-y-2">
                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Population</label>
                    <input
                      type="number" min="4" max="20" value={populationSize}
                      onChange={(e) => setPopulationSize(parseInt(e.target.value) || 6)}
                      disabled={isTraining}
                      className="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white font-mono disabled:opacity-50"
                    />
                  </div>
                  <div className="space-y-2">
                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Games/Match</label>
                    <input
                      type="number" min="2" max="10" value={gamesPerMatch}
                      onChange={(e) => setGamesPerMatch(parseInt(e.target.value) || 4)}
                      disabled={isTraining}
                      className="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white font-mono disabled:opacity-50"
                    />
                  </div>
                </div>

                <div className="flex gap-3">
                  {!isTraining ? (
                    <button
                      onClick={startTraining}
                      className="flex-1 py-4 bg-purple-600 hover:bg-purple-500 rounded-2xl font-bold text-white flex items-center justify-center gap-3 transition-all"
                    >
                      <span>🧬</span> Start Evolution
                    </button>
                  ) : (
                    <>
                      <button
                        onClick={togglePause}
                        className={`flex-1 py-4 ${isPaused ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-yellow-600 hover:bg-yellow-500'} rounded-2xl font-bold text-white flex items-center justify-center gap-3 transition-all`}
                      >
                        {isPaused ? '▶ Resume' : '⏸ Pause'}
                      </button>
                      <button
                        onClick={stopTraining}
                        className="flex-1 py-4 bg-red-600 hover:bg-red-500 rounded-2xl font-bold text-white flex items-center justify-center gap-3 transition-all"
                      >
                        ⏹ Stop
                      </button>
                    </>
                  )}
                </div>
              </div>

              {/* Progress */}
              <div className="space-y-4">
                <div className="flex justify-between text-sm">
                  <span className="text-slate-400">Training Progress</span>
                  <span className="font-mono text-purple-400">{currentGen}/{maxGen} generations</span>
                </div>
                <div className="h-4 bg-slate-950 rounded-full overflow-hidden border border-white/5">
                  <div
                    style={{ width: `${actualProgress}%` }}
                    className="h-full bg-gradient-to-r from-purple-600 to-pink-500 transition-all duration-500"
                  />
                </div>
                <div className="flex justify-between text-xs text-slate-500">
                  <span>Best Fitness: <span className="text-purple-400 font-bold">{bestFitness.toFixed(1)}</span></span>
                  <span className="font-mono">Game {gamesCompleted}/{totalGames}</span>
                  <span>{actualProgress.toFixed(0)}% complete</span>
                </div>
              </div>
            </div>

            {/* Logs */}
            <div className="glass rounded-[32px] p-8 h-[300px] flex flex-col bg-black/20">
              <h3 className="font-bold text-sm uppercase tracking-widest mb-6 flex items-center gap-3 text-slate-400">
                <span className="text-purple-400">›</span> Training Log
              </h3>
              <div className="flex-1 overflow-y-auto space-y-1 mono text-[11px] text-slate-400 custom-scrollbar">
                {logs.length === 0 && <div className="italic text-slate-600">Configure parameters and start training...</div>}
                {logs.map((log, i) => (
                  <div key={i} className="flex gap-2">
                    <span className="text-purple-500 shrink-0 opacity-50">›</span>
                    <span>{log}</span>
                  </div>
                ))}
                <div ref={logEndRef} />
              </div>
            </div>
          </div>

          {/* Sidebar */}
          <div className="lg:col-span-5 space-y-6">
            {/* Live Chessboard */}
            {isTraining && (
              currentGame ? (
                <LiveChessboard
                  fen={currentGame?.fen}
                  whiteId={currentGame?.white_id}
                  blackId={currentGame?.black_id}
                  moveCount={currentGame?.move_count}
                  lastMove={currentGame?.last_move}

                    addLog('🎮 Generating self-play training games...');

                    addLog('📚 Starting neural network training...');

                    addLog('✅ Training complete!');
                    setIsTraining(false);
                    setTrainingStartTime(null);
                  } else if (data.current_phase === 'error') {
                    addLog('❌ Training error occurred - check console');
                    setIsTraining(false);
                    setTrainingStartTime(null);
                  }
                }
                
                // Log self-play progress
                if (data.current_phase === 'self_play' && data.self_play?.games_completed > lastSelfPlayCount) {

                  addLog(`Epoch ${data.epochs_completed}/${data.target_epochs} - Loss: ${data.current_loss.toFixed(6)}`);

          if (data.ok) {
            setCheckpoints(data.checkpoints || []);
          }
        } catch (e) {
          console.error('Error loading checkpoints:', e);
        }
      };
      
      // Load checkpoints on mount and periodically
      useEffect(() => {
        loadCheckpoints();
        const interval = setInterval(loadCheckpoints, 30000); // Refresh every 30s
        return () => clearInterval(interval);
      }, []);
      
      const saveCheckpoint = async () => {
        if (!checkpointName.trim()) {
          addLog('❌ Please enter a checkpoint name');
          return;
        }
        
        try {
          const res = await fetch('http://localhost:5050/api/neural/checkpoint/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              name: checkpointName.trim(),
              description: checkpointDesc.trim()
            })
          });
          const data = await res.json();
          if (data.ok) {
            addLog(`💾 Checkpoint saved: ${checkpointName} (${data.positions_trained} positions)`);
            setCheckpointName('');
            setCheckpointDesc('');
            setShowCheckpointModal(false);
            loadCheckpoints();
          } else {
            addLog(`❌ Error: ${data.error}`);
          }
        } catch (e) {
          addLog(`❌ Error: ${e.message}`);
        }
      };
      
      const loadCheckpoint = async (filename, name) => {
        if (!confirm(`Load checkpoint "${name}"? This will replace current network weights.`)) {
          return;
        }
        
        setLoadingCheckpoint(true);
        try {
          const res = await fetch('http://localhost:5050/api/neural/checkpoint/load', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename })
          });
          const data = await res.json();
          if (data.ok) {
            addLog(`✅ Loaded checkpoint: ${data.name} (${data.positions_trained} positions, v${data.version})`);
            setNetworkSaved(false);
          } else {
            addLog(`❌ Error: ${data.error}`);
          }
        } catch (e) {
          addLog(`❌ Error: ${e.message}`);
        } finally {
          setLoadingCheckpoint(false);
        }
      };
      
      const deleteCheckpoint = async (filename, name) => {
        if (!confirm(`Delete checkpoint "${name}"? This cannot be undone.`)) {
          return;
        }
        
        try {
          const res = await fetch('http://localhost:5050/api/neural/checkpoint/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename })
          });
          const data = await res.json();
          if (data.ok) {
            addLog(`🗑️ Deleted checkpoint: ${name}`);
            loadCheckpoints();
          } else {
            addLog(`❌ Error: ${data.error}`);
          }
        } catch (e) {
          addLog(`❌ Error: ${e.message}`);
        }
      };

      // ==================== Hybrid Training ====================
      
      const startHybridTraining = async () => {
        addLog(`🚀 Starting hybrid training: ${hybridGames} games...`);
        setIsHybridTraining(true);
        setNetworkSaved(false);
        setHybridProgress({ phase: 'starting', games_completed: 0, total_games: hybridGames });
        
        try {
          const res = await fetch('http://localhost:5050/api/neural/hybrid-train', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              total_games: hybridGames,
              learning_rate: learningRate,
              supervised_ratio: supervisedRatio,
              save_interval: Math.max(50, Math.floor(hybridGames / 10))
            })
          });
          const data = await res.json();
          
          if (data.ok) {
            addLog(`✅ Hybrid training started!`);
            
            // Poll for status
            let lastLoggedGame = 0;
            const pollStatus = async () => {
              try {
                const statusRes = await fetch('http://localhost:5050/api/neural/hybrid-status');
                const status = await statusRes.json();
                
                setHybridProgress(status);
                
                if (status.phase === 'self_play' || status.phase === 'rl_training') {
                  // Log every 50 games
                  if (status.games_completed >= lastLoggedGame + 50) {
                    lastLoggedGame = status.games_completed;
                    addLog(`🎮 Game ${status.games_completed}/${status.total_games} - ${status.positions_trained} positions, loss: ${status.current_loss?.toFixed(6) || 'N/A'}`);
                  }
                  setTimeout(pollStatus, 2000);
                } else if (status.phase === 'complete') {
                  addLog(`🎉 Hybrid training complete!`);
                  addLog(`📊 ${status.games_completed} games, ${status.positions_trained} positions`);
                  addLog(`📉 Best loss: ${status.best_loss?.toFixed(6) || 'N/A'}`);
                  setIsHybridTraining(false);
                  loadCheckpoints();
                } else if (status.phase === 'error' || status.phase === 'stopped') {
                  addLog(`⚠️ Training ${status.phase}: ${status.message || ''}`);
                  setIsHybridTraining(false);
                } else {
                  setTimeout(pollStatus, 1000);
                }
              } catch (e) {
                console.error('Hybrid status poll error:', e);
                setTimeout(pollStatus, 3000);
              }
            };
            
            setTimeout(pollStatus, 1000);
          } else {
            addLog(`❌ Error: ${data.error}`);
            setIsHybridTraining(false);
          }
        } catch (e) {
          addLog(`❌ Error: ${e.message}`);
          setIsHybridTraining(false);
        }
      };
      
      const stopHybridTraining = async () => {
        try {
          await fetch('http://localhost:5050/api/neural/hybrid-stop', { method: 'POST' });
          addLog('⏹️ Stopping hybrid training...');
        } catch (e) {
          addLog(`❌ Error: ${e.message}`);
        }
      };

      // Supervised learning training function
      const startSupervisedTraining = async () => {
        addLog('📚 Starting supervised learning from heuristic...');
        setIsSupervisedTraining(true);
        setNetworkSaved(false);
        setShowSupervisedComplete(false);
        setSupervisedProgress({ phase: 'starting', epoch: 0, totalEpochs: epochs, pct: 0, loss: 0 });

        try {
          // Start the training (returns immediately)
          const response = await fetch('http://localhost:5050/api/neural/supervised-train', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              num_positions: supervisedPositions,
              learning_rate: learningRate,
              epochs: epochs
            })
          });
          const data = await response.json();
          
          if (data.ok) {
            addLog(`🚀 Supervised training started: ${supervisedPositions} positions, ${epochs} epochs`);
            
            // Poll for status until complete
            let lastLoggedEpoch = 0;
            const pollStatus = async () => {
              try {
                const statusRes = await fetch('http://localhost:5050/api/neural/supervised-status');
                const status = await statusRes.json();
                
                if (status.phase === 'starting') {
                  setSupervisedProgress({ phase: 'starting', epoch: 0, totalEpochs: status.total_epochs, pct: 0, loss: 0 });
                  setTimeout(pollStatus, 1000);
                } else if (status.phase === 'training') {
                  const pct = Math.round((status.positions_trained / status.target_positions) * 100);
                  setSupervisedProgress({ 
                    phase: 'training', 
                    epoch: status.current_epoch, 
                    totalEpochs: status.total_epochs, 
                    pct, 
                    loss: status.current_loss,
                    positions: status.positions_trained,
                    targetPositions: status.target_positions
                  });
                  // Only log when epoch changes to avoid spam
                  if (status.current_epoch > lastLoggedEpoch) {
                    lastLoggedEpoch = status.current_epoch;
                    addLog(`📊 Epoch ${status.current_epoch}/${status.total_epochs} - Loss: ${status.current_loss?.toFixed(6) || 'N/A'} (${pct}%)`);
                  }
                  // Continue polling
                  setTimeout(pollStatus, 1500);
                } else if (status.phase === 'complete') {
                  addLog(`✅ Supervised training complete!`);
                  addLog(`📈 Trained on ${status.positions_trained} positions`);
                  addLog(`📉 Final loss: ${status.final_loss?.toFixed(6) || 'N/A'}`);
                  addLog(`🔢 Network version: v${status.version}`);
                  setSupervisedProgress(null);
                  setSupervisedResult({
                    positions: status.positions_trained,
                    loss: status.final_loss,
                    version: status.version
                  });
                  setShowSupervisedComplete(true);
                  setIsSupervisedTraining(false);
                  // Auto-hide success banner after 10 seconds
                  setTimeout(() => setShowSupervisedComplete(false), 10000);
                } else if (status.phase === 'error') {
                  addLog(`❌ Training error occurred`);
                  setSupervisedProgress(null);
                  setIsSupervisedTraining(false);
                } else {
                  // Still idle or unknown, keep polling
                  setTimeout(pollStatus, 1000);
                }
              } catch (e) {
                console.error('Status poll error:', e);
                setTimeout(pollStatus, 2000);
              }
            };
            
            // Start polling after a short delay
            setTimeout(pollStatus, 500);
          } else {
            addLog(`❌ Error: ${data.error}`);
            setSupervisedProgress(null);
            setIsSupervisedTraining(false);
          }
        } catch (e) {
          addLog(`❌ Connection error: ${e.message}`);
          setSupervisedProgress(null);
          setIsSupervisedTraining(false);
        }
      };

      const stats = neuralStatus?.network_stats || {};
      const dataStats = neuralStatus?.data_stats || {};
      const progress = neuralStatus?.progress_percent || 0;

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 relative">

                <div className="p-4 bg-gradient-to-r from-amber-600/90 to-orange-600/90 rounded-2xl shadow-lg shadow-amber-500/20 flex items-center justify-between">
                  <div className="flex items-center gap-4">
                    <div className="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center">
                      <span className="text-2xl animate-spin">⚙️</span>
                    </div>
                    <div>
                      <div className="text-lg font-bold text-white">Supervised Training in Progress</div>
                      <div className="text-sm text-amber-100">
                        {supervisedProgress.phase === 'starting' 
                          ? 'Initializing...' 
                          : `Epoch ${supervisedProgress.epoch}/${supervisedProgress.totalEpochs} • ${supervisedProgress.pct}% complete`}
                      </div>
                    </div>
                  </div>
                  <div className="text-right">
                    <div className="text-3xl font-black text-white">{supervisedProgress.pct || 0}%</div>
                    <div className="text-xs text-amber-200">Loss: {supervisedProgress.loss?.toFixed(4) || '...'}</div>
                  </div>
                </div>
              )}
              
              {showSupervisedComplete && supervisedResult && !isSupervisedTraining && (
                <div className="p-4 bg-gradient-to-r from-emerald-600/90 to-green-600/90 rounded-2xl shadow-lg shadow-emerald-500/20 flex items-center justify-between">
                  <div className="flex items-center gap-4">
                    <div className="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center">
                      <span className="text-2xl">🎉</span>
                    </div>
                    <div>
                      <div className="text-lg font-bold text-white">Training Complete!</div>
                      <div className="text-sm text-emerald-100">
                        Trained on {supervisedResult.positions} positions • Final loss: {supervisedResult.loss?.toFixed(6)} • Network v{supervisedResult.version}
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                    <div className="text-sm text-emerald-100 bg-white/10 px-3 py-1 rounded-lg">
                      👉 Click "Save & Apply" to use on Lichess
                    </div>
                    <button 
                      onClick={() => setShowSupervisedComplete(false)}
                      className="text-white/70 hover:text-white text-2xl font-bold"
                    >×</button>
                  </div>
                </div>
              )}
            </div>

                <div>
                  <div className="font-bold text-white mb-1">Educational Demo</div>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    This neural network training is for <span className="text-blue-300">learning how AI works</span>, not for making a strong chess bot. 
                    Real chess neural networks (like AlphaZero) require millions of games and massive compute. 
                    For actual gameplay, use <span className="text-emerald-300 font-bold">Heuristic Only</span> mode in "Apply to Bot" below.
                  </p>
                </div>
              </div>
            </div>
            
            {/* Main Training Panel */}
            <div className="glass rounded-[40px] p-10 shadow-2xl relative overflow-hidden bg-slate-900/40">
              <div className="absolute top-0 right-0 w-80 h-80 bg-cyan-600/5 blur-[120px] pointer-events-none" />

              <div className="flex items-center justify-between mb-8">
                <div className="space-y-1">
                  <h2 className="text-3xl font-black text-white">Neural Network Training</h2>
                  <p className="text-slate-500 font-medium">Deep learning position evaluation (educational)</p>
                </div>
                <div className="glass px-4 py-2 rounded-2xl border-cyan-500/20">
                  <span className="text-[10px] font-bold uppercase tracking-[0.2em] text-cyan-400">Educational</span>
                </div>
              </div>

              {/* SIMPLIFIED TRAINING - Hybrid is the main method */}
              <div className="space-y-6 mb-8">
                
                {/* Primary Training Method: Hybrid */}
                <div className="p-5 bg-gradient-to-r from-purple-500/10 to-cyan-500/10 rounded-2xl border-2 border-purple-500/40 space-y-4">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <span className="text-2xl">🔥</span>
                      <div>
                        <div className="text-lg font-bold text-white">Train Your Network</div>
                        <div className="text-xs text-slate-400">Hybrid: supervised + reinforcement learning combined</div>
                      </div>
                    </div>
                  </div>
                  
                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1">
                      <label className="text-xs text-slate-400">Number of Games</label>
                      <input
                        type="number" min="100" max="100000" step="100" value={hybridGames}
                        onChange={(e) => setHybridGames(parseInt(e.target.value) || 1000)}
                        disabled={isHybridTraining || isTraining || isSupervisedTraining}
                        className="w-full bg-slate-950 border border-purple-500/30 rounded-xl px-3 py-2 text-white font-mono text-sm disabled:opacity-50"
                      />
                    </div>
                    <div className="space-y-1">
                      <label className="text-xs text-slate-400">Learning Rate</label>
                      <input
                        type="number" min="0.001" max="0.1" step="0.001" value={learningRate}
                        onChange={(e) => setLearningRate(parseFloat(e.target.value) || 0.01)}
                        disabled={isHybridTraining || isTraining || isSupervisedTraining}
                        className="w-full bg-slate-950 border border-purple-500/30 rounded-xl px-3 py-2 text-white font-mono text-sm disabled:opacity-50"
                      />
                    </div>
                  </div>
                  
                  <div className="p-3 bg-slate-950/50 rounded-xl text-xs text-slate-400">
                    <span className="text-purple-300 font-bold">How it works:</span> Plays self-play games, learning from both the heuristic evaluation (immediate feedback) and game outcomes (long-term strategy). 
                    <span className="text-amber-300"> Training is cumulative</span> - each session adds to previous learning.
                  </div>
                  
                  {!isHybridTraining ? (
                    <button
                      onClick={startHybridTraining}
                      disabled={isTraining || isSupervisedTraining}
                      className="w-full py-4 bg-gradient-to-r from-purple-600 to-cyan-600 hover:from-purple-500 hover:to-cyan-500 disabled:from-slate-700 disabled:to-slate-700 rounded-xl font-bold text-white text-lg transition-all disabled:opacity-50 flex items-center justify-center gap-2 shadow-lg shadow-purple-500/20"
                    >
                      <span>🚀</span> Start Training ({hybridGames.toLocaleString()} games)

                  ) : (
                    <button

                      className="w-full py-4 bg-red-600 hover:bg-red-500 rounded-xl font-bold text-white text-lg transition-all flex items-center justify-center gap-2"
                    >
                      <span>⏹</span> Stop & Save Progress
                    </button>
                  )}
                  
                  {/* Hybrid Training Progress */}
                  {hybridProgress && hybridProgress.phase !== 'idle' && (
                    <div className="p-4 bg-gradient-to-r from-purple-500/20 to-cyan-500/20 rounded-xl border border-purple-400/30">

                            <div className="text-sm font-bold text-purple-200">
                              {hybridProgress.phase === 'self_play' ? 'Playing & Learning...' : 
                               hybridProgress.phase === 'rl_training' ? 'Reinforcement Learning...' :
                               hybridProgress.phase === 'complete' ? 'Complete!' :
                               hybridProgress.phase === 'stopped' ? 'Stopped & Saved' :
                               hybridProgress.message || 'Training...'}
                            </div>
                            <div className="text-xs text-purple-300/70">
                              Game {hybridProgress.games_completed || 0}/{hybridProgress.total_games || hybridGames}
                            </div>
                          </div>
                        </div>
                        <div className="text-right">
                          <div className="text-2xl font-black text-purple-300">
                            {Math.round(((hybridProgress.games_completed || 0) / (hybridProgress.total_games || hybridGames)) * 100)}%
                          </div>
                          <div className="text-[10px] text-purple-400/60">
                            {(hybridProgress.positions_trained || 0).toLocaleString()} pos
                          </div>
                        </div>
                      </div>
                      <div className="h-3 bg-slate-900/50 rounded-full overflow-hidden">
                        <div 
                          className="h-full bg-gradient-to-r from-purple-500 to-cyan-400 rounded-full transition-all duration-500"
                          style={{ width: `${((hybridProgress.games_completed || 0) / (hybridProgress.total_games || hybridGames)) * 100}%` }}
                        />

                      <div className="mt-2 flex justify-between text-[10px] text-slate-500">
                        <span>Loss: {hybridProgress.current_loss?.toFixed(6) || 'N/A'}</span>
                        <span>Best: {hybridProgress.best_loss?.toFixed(6) || 'N/A'}</span>

                </div>

                {/* Advanced Options - Collapsible */}
                <details className="group">
                  <summary className="cursor-pointer p-3 bg-slate-800/50 rounded-xl text-sm text-slate-400 hover:text-white transition-all flex items-center justify-between">

                  <div className="mt-4 space-y-4 p-4 bg-slate-900/30 rounded-xl border border-white/5">
                    {/* Supervised Learning Quick Train */}

                      <div className="flex items-center justify-between">

                          <div>
                            <div className="text-sm font-bold text-amber-300">Quick Supervised Training</div>
                            <div className="text-[10px] text-slate-500">Fast training from heuristic (supplements hybrid)</div>
                          </div>
                        </div>
                        <button
                          onClick={() => setShowSupervisedModal(true)}
                          className="text-xs text-amber-400 hover:text-amber-300"
                        >ℹ️</button>
                      </div>
                      
                      <div className="flex items-center gap-2">
                        <input
                          type="number" min="1000" max="50000" step="1000" value={supervisedPositions}
                          onChange={(e) => setSupervisedPositions(parseInt(e.target.value) || 5000)}

                        />
                        <button
                          onClick={startSupervisedTraining}
                          disabled={isTraining || isSupervisedTraining || isHybridTraining}
                          className="px-4 py-2 bg-amber-600 hover:bg-amber-500 disabled:bg-slate-700 rounded-lg font-bold text-white text-sm transition-all disabled:opacity-50"
                        >
                          {isSupervisedTraining ? '⟳' : '⚡'} Train
                        </button>
                      </div>
                      
                      {/* Supervised Progress */}
                      {supervisedProgress && (
                        <div className="p-3 bg-amber-500/10 rounded-lg">
                          <div className="flex justify-between text-xs mb-1">
                            <span className="text-amber-300">Epoch {supervisedProgress.epoch}/{supervisedProgress.totalEpochs}</span>
                            <span className="text-amber-400">{supervisedProgress.pct}%</span>
                          </div>
                          <div className="h-2 bg-slate-900 rounded-full overflow-hidden">
                            <div className="h-full bg-amber-500 transition-all" style={{ width: `${supervisedProgress.pct}%` }} />
                          </div>
                        </div>
                      )}
                    </div>
                    
                    {/* Legacy RL Training */}
                    <div className="p-4 bg-slate-800/30 rounded-xl border border-white/5 space-y-3">
                      <div className="flex items-center gap-2">

                        <div>
                          <div className="text-sm font-bold text-slate-300">Legacy RL Training</div>
                          <div className="text-[10px] text-slate-500">Pure reinforcement learning (slower, use Hybrid instead)</div>
                        </div>
                      </div>
                      
                      <div className="grid grid-cols-2 gap-2">
                        <div className="space-y-1">

                          <input
                            type="number" min="1" max="100" value={epochs}

                            disabled={isTraining || isHybridTraining}
                            className="w-full bg-slate-950 border border-white/10 rounded-lg px-2 py-1.5 text-white font-mono text-xs disabled:opacity-50"

                          <input
                            type="number" min="10" max="500" value={selfPlayGames}

                          />

                      </div>
                      
                      <div className="flex gap-2">
                        <button
                          onClick={startTraining}

                        >
                          {isTraining ? '⟳ Training...' : '🎮 Start RL'}

                    {/* Training Parameters */}

                          <input
